name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mylog_test
          MYSQL_USER: mylog
          MYSQL_PASSWORD: mylog_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 类型检查（前端 + 服务端）+ 打包
      - run: npm run build

      - name: 测试（含服务端接口测试）
        run: npm test
        env:
          TEST_DATABASE_URL: mysql://mylog:mylog_dev@127.0.0.1:3306/mylog_test
          REQUIRE_DB: '1'
