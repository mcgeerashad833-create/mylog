# 云服务器上只跑 MyLog，数据存在云数据库（阿里云 RDS、腾讯云 MySQL 等）。用法见 docs/02-部署.md
services:
  app:
    build: .
    image: mylog:latest
    restart: unless-stopped
    environment:
      # 在 .env 里填写，例如 mysql://mylog:密码@数据库内网地址:3306/mylog
      DATABASE_URL: ${DATABASE_URL:?请在 .env 里设置 DATABASE_URL（云数据库连接串）}
      TRUST_PROXY: "1"
      TZ: Asia/Shanghai
      # 走公网连接云数据库时：把云厂商的 CA 证书放到 deploy/db-ca.pem，再取消下面三行的注释
      # DATABASE_CA_FILE: /app/db-ca.pem
    # volumes:
    #   - ./deploy/db-ca.pem:/app/db-ca.pem:ro
    # 只对本机开放，由 Nginx 负责 HTTPS 和对外
    ports:
      - "127.0.0.1:8787:8787"
