<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MyLog · 会中记录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3A5CCC}a:hover{color:#2B479F}
button,input{font-family:inherit}
input::placeholder{color:#8A9099}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #FFFFFF; color: #1F2328; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; padding: 14px 28px; border-bottom: 1px solid #ECECE9">
    <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
      <a href="Prep.dc.html" style="font-size: 13px; text-decoration: none">‹ 会议详情</a>
      <span style="font-size: 17px; font-weight: 600">产品周会</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 12px; background: #FDECEA; color: #B3261E; font-size: 12px">
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #B3261E"></span>记录中
      </span>
      <span style="font-size: 13px; color: #5E6670; font-variant-numeric: tabular-nums">已开 {{elapsed}}</span>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <a href="https://meeting.tencent.com/" style="display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border: 1px solid #E1E3E8; border-radius: 8px; color: #1F2328; text-decoration: none; font-size: 13px">回到腾讯会议</a>
      <a href="Minutes.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 8px; background: #3A5CCC; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 500">结束会议 · 生成纪要</a>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">

    <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 24px; display: flex; flex-direction: column; gap: 20px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; max-width: 760px; width: 100%; align-self: center">
        <sc-for list="{{entries}}" as="e" hint-placeholder-count="6">
          <div style="display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; border-bottom: 1px solid #F5F5F3">
            <span style="flex: none; width: 44px; line-height: 22px; font-size: 12px; color: #5E6670; font-variant-numeric: tabular-nums">{{e.at}}</span>
            <span style="flex: none; width: 40px; height: 22px; border-radius: 11px; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; background: {{e.tagBg}}; color: {{e.tagFg}}">{{e.label}}</span>
            <span style="flex: 1; line-height: 22px; display: flex; flex-wrap: wrap; gap: 4px 10px">
              <span>{{e.text}}</span>
              <sc-if value="{{e.hasMeta}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 12px; color: #2B479F">{{e.meta}}</span>
              </sc-if>
            </span>
          </div>
        </sc-for>
      </div>

      <div style="max-width: 760px; width: 100%; align-self: center; box-sizing: border-box; border: 1px solid #D5DCF2; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF">
        <div role="group" aria-label="记录类型" style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13px; cursor: pointer; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8px">
          <label for="draft" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">记录内容</label>
          <input id="draft" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E1E3E8; border-radius: 8px; font-size: 14px; color: #1F2328">
          <button type="button" onClick="{{add}}" style="height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #3A5CCC; color: #FFFFFF; font-size: 14px; font-weight: 500; cursor: pointer">记下</button>
        </div>
        <span style="font-size: 12px; color: #5E6670">回车记下。也可以用「决：」「待：」「问：」开头；待办里写 @某人 和「周五前」会自动识别负责人和截止日期，不写 @ 默认是我。</span>
      </div>
    </main>

    <aside style="flex: 1 1 280px; box-sizing: border-box; padding: 24px 20px; background: #F7F7F5; border-left: 1px solid #ECECE9; display: flex; flex-direction: column; gap: 24px">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #5E6670">我的会前备注</h2>
        <sc-for list="{{notes}}" as="n" hint-placeholder-count="2">
          <button type="button" aria-pressed="{{n.pressed}}" onClick="{{n.toggle}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 4px; border: 0; background: transparent; text-align: left; font-size: 14px; cursor: pointer; color: {{n.fg}}">
            <span style="width: 18px; height: 18px; flex: none; box-sizing: border-box; border-radius: 4px; border: 1.5px solid {{n.ring}}; background: {{n.fill}}; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center">{{n.tick}}</span>
            <span style="text-decoration: {{n.strike}}">{{n.text}}</span>
          </button>
        </sc-for>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #5E6670">上次留下的待办</h2>
        <div style="display: flex; flex-direction: column; gap: 2px; font-size: 13px">
          <span>整理新版首页的数据口径</span>
          <span style="color: #B3261E">我负责 · 逾期 1 天</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; font-size: 13px">
          <span>确认埋点方案</span>
          <span style="color: #5E6670">李娜负责 · 会上问一下</span>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #5E6670">本场已记</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
            <div style="background: #FFFFFF; border: 1px solid #ECECE9; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 20px; font-weight: 600; color: {{s.fg}}">{{s.n}}</span>
              <span style="font-size: 12px; color: #5E6670">{{s.label}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      totalSecs: 1104,
      type: 'note',
      draft: '',
      checked: { 0: true },
      entries: [
        { at: 95, type: 'note', text: '上周数据口径还差两个指标没对齐' },
        { at: 260, type: 'decision', text: '埋点方案沿用旧版，不再单独评审' },
        { at: 412, type: 'note', text: '首页灰度定在 11月5日开始' },
        { at: 655, type: 'note', text: '张伟讲了 v3 方案：首屏改为个性化推荐' },
        { at: 830, type: 'question', text: '推荐位的冷启动怎么处理？' },
        { at: 905, type: 'todo', text: '出一版冷启动兜底方案', owner: '李娜', due: '周五前' },
        { at: 1010, type: 'todo', text: '补齐两个数据指标口径', owner: '我', due: '周五前' }
      ]
    };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ totalSecs: this.state.totalSecs + 1 }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  addEntry() {
    let text = this.state.draft.trim();
    if (!text) return;
    let type = this.state.type;
    const prefix = { '决': 'decision', '待': 'todo', '问': 'question' };
    const m = text.match(/^([决待问])[:：]\s*/);
    if (m) { type = prefix[m[1]]; text = text.slice(m[0].length); }
    const entry = { at: this.state.totalSecs, type, text };
    if (type === 'todo') {
      const who = text.match(/@(\S+)/);
      const due = text.match(/(今天|明天|后天|周[一二三四五六日天])前?/);
      entry.owner = who ? who[1] : '我';
      if (who) text = text.replace(who[0], '');
      if (due) { entry.due = due[0]; text = text.replace(due[0], ''); }
      entry.text = text.replace(/\s+/g, ' ').trim();
    }
    this.setState({ entries: this.state.entries.concat([entry]), draft: '' });
  }
  renderVals() {
    const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    const tagStyle = {
      note: { label: '笔记', tagBg: '#F1F2F4', tagFg: '#3F4650' },
      decision: { label: '决议', tagBg: '#E6F2EA', tagFg: '#22663F' },
      todo: { label: '待办', tagBg: '#E9EDF8', tagFg: '#2B479F' },
      question: { label: '问题', tagBg: '#FBEFE3', tagFg: '#8A4B12' }
    };
    const entries = this.state.entries.map((e) => {
      const meta = [e.owner ? '@' + e.owner : '', e.due || ''].filter(Boolean).join(' · ');
      return Object.assign({ at: fmt(e.at), text: e.text, meta, hasMeta: !!meta }, tagStyle[e.type]);
    });
    const types = ['note', 'decision', 'todo', 'question'].map((id) => {
      const on = this.state.type === id;
      return {
        label: tagStyle[id].label,
        pressed: String(on),
        bg: on ? tagStyle[id].tagBg : '#FFFFFF',
        fg: on ? tagStyle[id].tagFg : '#3F4650',
        border: on ? tagStyle[id].tagFg : '#E1E3E8',
        pick: () => this.setState({ type: id })
      };
    });
    const placeholders = {
      note: '记一笔…',
      decision: '这件事定了什么？',
      todo: '要做什么 @负责人 截止时间，例如：改首页文案 @张伟 周三前',
      question: '还没解决的问题…'
    };
    const checked = this.state.checked;
    const notes = ['问清首页灰度从哪天开始', '带上上周的数据截图'].map((text, i) => {
      const on = !!checked[i];
      return {
        text,
        pressed: String(on),
        tick: on ? '✓' : '',
        ring: on ? '#2F7D4F' : '#9AA1AB',
        fill: on ? '#2F7D4F' : '#FFFFFF',
        fg: on ? '#5E6670' : '#1F2328',
        strike: on ? 'line-through' : 'none',
        toggle: () => this.setState({ checked: Object.assign({}, checked, { [i]: !on }) })
      };
    });
    const count = (fn) => this.state.entries.filter(fn).length;
    const stats = [
      { label: '决议', n: count((e) => e.type === 'decision'), fg: '#22663F' },
      { label: '我的待办', n: count((e) => e.type === 'todo' && e.owner === '我'), fg: '#2B479F' },
      { label: '别人的待办', n: count((e) => e.type === 'todo' && e.owner !== '我'), fg: '#2B479F' },
      { label: '问题', n: count((e) => e.type === 'question'), fg: '#8A4B12' }
    ];
    return {
      elapsed: fmt(this.state.totalSecs),
      entries,
      types,
      notes,
      stats,
      draft: this.state.draft,
      placeholder: placeholders[this.state.type],
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') this.addEntry(); },
      add: () => this.addEntry()
    };
  }
}
</script>
</body>
</html>
