<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MyLog · 日志与晚间收尾</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3A5CCC}a:hover{color:#2B479F}
button,textarea{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #FFFFFF; color: #1F2328; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px">

  <nav aria-label="主导航" style="flex: 1 1 220px; box-sizing: border-box; background: #F7F7F5; border-right: 1px solid #ECECE9; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px">
    <div style="padding: 4px 10px 16px; font-size: 17px; font-weight: 600">MyLog</div>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; color: #1F2328; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <span style="flex: 1">今天</span><span style="color: #5E6670; font-size: 13px">2</span>
    </a>
    <a href="Inbox.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; color: #1F2328; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
      <span style="flex: 1">收集箱</span><span style="color: #5E6670; font-size: 13px">4</span>
    </a>
    <a href="Later.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; color: #1F2328; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      <span style="flex: 1">以后</span><span style="color: #5E6670; font-size: 13px">11</span>
    </a>
    <a href="Log.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; background: #E9EDF8; color: #1F2328; text-decoration: none; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A5CCC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"></path><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 19.5"></path></svg>
      <span style="flex: 1">日志</span>
    </a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px 32px 64px; display: flex; justify-content: center">
    <div style="width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 28px">

      <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
        <div style="display: flex; align-items: center; gap: 8px">
          <button aria-label="前一天" style="width: 36px; height: 36px; border: 1px solid #E1E3E8; border-radius: 8px; background: #FFFFFF; color: #5E6670; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
          <h1 style="margin: 0 8px; font-size: 28px; font-weight: 600; line-height: 36px">10月21日 周三</h1>
          <button aria-label="后一天" disabled style="width: 36px; height: 36px; border: 1px solid #ECECE9; border-radius: 8px; background: #FFFFFF; color: #C4C8CF; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
        </div>
        <span style="font-size: 14px; color: #5E6670">完成 7 件 · 剩 2 件</span>
      </header>

      <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

        <section aria-label="今天完成的事" style="flex: 3 1 360px; min-width: 0; display: flex; flex-direction: column">
          <h2 style="margin: 0 0 12px; font-size: 15px; font-weight: 500">完成记录</h2>
          <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
            <li style="display: grid; grid-template-columns: 56px 16px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #F0F0EE"><span style="font-size: 13px; color: #6B7280; font-variant-numeric: tabular-nums">09:12</span><span style="width: 8px; height: 8px; border-radius: 50%; background: #3A5CCC"></span><span>整理桌面文件</span></li>
            <li style="display: grid; grid-template-columns: 56px 16px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #F0F0EE"><span style="font-size: 13px; color: #6B7280; font-variant-numeric: tabular-nums">09:30</span><span style="width: 8px; height: 8px; border-radius: 50%; background: #3A5CCC"></span><span>回复小李的微信</span></li>
            <li style="display: grid; grid-template-columns: 56px 16px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #F0F0EE"><span style="font-size: 13px; color: #6B7280; font-variant-numeric: tabular-nums">09:48</span><span style="width: 8px; height: 8px; border-radius: 50%; background: #3A5CCC"></span><span>打印合同两份</span></li>
            <li style="display: grid; grid-template-columns: 56px 16px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #F0F0EE"><span style="font-size: 13px; color: #6B7280; font-variant-numeric: tabular-nums">10:20</span><span style="width: 8px; height: 8px; border-radius: 50%; background: #3A5CCC"></span><span>回复张经理关于报价的邮件</span></li>
            <li style="display: grid; grid-template-columns: 56px 16px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #F0F0EE"><span style="font-size: 13px; color: #6B7280; font-variant-numeric: tabular-nums">15:05</span><span style="width: 8px; height: 8px; border-radius: 50%; background: #3A5CCC"></span><span>部门周会</span></li>
            <li style="display: grid; grid-template-columns: 56px 16px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #F0F0EE"><span style="font-size: 13px; color: #6B7280; font-variant-numeric: tabular-nums">15:40</span><span style="width: 8px; height: 8px; border-radius: 50%; background: #3A5CCC"></span><span>给物业打电话问停车位</span></li>
            <li style="display: grid; grid-template-columns: 56px 16px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #F0F0EE"><span style="font-size: 13px; color: #6B7280; font-variant-numeric: tabular-nums">17:10</span><span style="width: 8px; height: 8px; border-radius: 50%; background: #3A5CCC"></span><span>取快递（驿站）</span></li>
          </ol>

          <h2 style="margin: 32px 0 12px; font-size: 15px; font-weight: 500">最近几天</h2>
          <div style="display: flex; flex-direction: column">
            <button style="display: flex; justify-content: space-between; align-items: center; height: 44px; border: 0; border-bottom: 1px solid #F0F0EE; background: transparent; padding: 0; font-size: 14px; color: #1F2328; cursor: pointer; text-align: left"><span>10月20日 周二</span><span style="color: #5E6670; font-size: 13px">完成 9 件 · “报价终于发出去了”</span></button>
            <button style="display: flex; justify-content: space-between; align-items: center; height: 44px; border: 0; border-bottom: 1px solid #F0F0EE; background: transparent; padding: 0; font-size: 14px; color: #1F2328; cursor: pointer; text-align: left"><span>10月19日 周一</span><span style="color: #5E6670; font-size: 13px">完成 6 件</span></button>
            <button style="display: flex; justify-content: space-between; align-items: center; height: 44px; border: 0; border-bottom: 1px solid #F0F0EE; background: transparent; padding: 0; font-size: 14px; color: #1F2328; cursor: pointer; text-align: left"><span>10月18日 周日</span><span style="color: #5E6670; font-size: 13px">完成 3 件</span></button>
          </div>
        </section>

        <section aria-label="晚间收尾" style="flex: 2 1 320px; min-width: 0; box-sizing: border-box; border: 1px solid #E6E6E3; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h2 style="margin: 0; font-size: 17px; font-weight: 600">结束今天</h2>
            <span style="font-size: 13px; color: #5E6670">还有 2 件没做完，给它们安排个去处。</span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid #F0F0EE">
              <span style="font-size: 14px">交 10 月报销单 <span style="color: #6B7280; font-size: 12px">· 子步骤 2/3</span></span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap">
                <button aria-pressed="true" style="height: 32px; padding: 0 12px; border: 1px solid #3A5CCC; border-radius: 6px; background: #EEF2FC; color: #2B479F; font-size: 13px; cursor: pointer">明天</button>
                <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; color: #1F2328; font-size: 13px; cursor: pointer">选日期</button>
                <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; color: #1F2328; font-size: 13px; cursor: pointer">放回收集箱</button>
                <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; color: #1F2328; font-size: 13px; cursor: pointer">不做了</button>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 14px">订周五去上海的高铁票</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap">
                <button aria-pressed="true" style="height: 32px; padding: 0 12px; border: 1px solid #3A5CCC; border-radius: 6px; background: #EEF2FC; color: #2B479F; font-size: 13px; cursor: pointer">明天</button>
                <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; color: #1F2328; font-size: 13px; cursor: pointer">选日期</button>
                <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; color: #1F2328; font-size: 13px; cursor: pointer">放回收集箱</button>
                <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; color: #1F2328; font-size: 13px; cursor: pointer">不做了</button>
              </div>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="log-note" style="font-size: 14px; font-weight: 500">今天一句话 <span style="font-weight: 400; color: #6B7280; font-size: 12px">（可不写）</span></label>
            <textarea id="log-note" rows="3" placeholder="比如：下午效率不错，琐事基本清完了。" style="resize: vertical; border: 1px solid #E1E3E8; border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 22px; color: #1F2328; outline: none"></textarea>
          </div>

          <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; background: #3A5CCC; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">结束今天</a>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
