<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MyLog · 收集箱</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3A5CCC}a:hover{color:#2B479F}
button,input{font-family:inherit}
input::placeholder{color:#8A9099}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #FFFFFF; color: #1F2328; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px">

  <nav aria-label="主导航" style="flex: 1 1 220px; box-sizing: border-box; background: #F7F7F5; border-right: 1px solid #ECECE9; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px">
    <div style="padding: 4px 10px 16px; font-size: 17px; font-weight: 600">MyLog</div>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; color: #1F2328; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <span style="flex: 1">今天</span><span style="color: #5E6670; font-size: 13px">{{todayCount}}</span>
    </a>
    <a href="Inbox.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; background: #E9EDF8; color: #1F2328; text-decoration: none; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A5CCC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
      <span style="flex: 1">收集箱</span><span style="color: #5E6670; font-size: 13px">{{count}}</span>
    </a>
    <a href="Later.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; color: #1F2328; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      <span style="flex: 1">以后</span><span style="color: #5E6670; font-size: 13px">{{laterCount}}</span>
    </a>
    <a href="Log.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; color: #1F2328; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"></path><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 19.5"></path></svg>
      <span style="flex: 1">日志</span>
    </a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px 32px 64px; display: flex; justify-content: center">
    <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 24px">

      <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 28px; font-weight: 600; line-height: 36px">收集箱</h1>
          <span style="color: #5E6670">随手记下、还没定时间的事。不用急着处理。</span>
        </div>
        <a href="Plan.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border: 1px solid #E1E3E8; border-radius: 8px; color: #1F2328; text-decoration: none; font-size: 13px">逐条整理</a>
      </header>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 1px solid #DADDE3; border-radius: 10px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A5CCC" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          <label for="inbox-add" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">记到收集箱</label>
          <input id="inbox-add" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" placeholder="想到什么先记下，回车保存" style="flex: 1; min-width: 0; border: 0; outline: none; font-size: 15px; color: #1F2328; background: transparent; height: 100%">
        </div>
        <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
          <div role="status" style="padding: 0 4px; font-size: 12px; color: #2F7D4F">{{toast}}</div>
        </sc-if>
      </div>

      <section aria-label="收集箱事项" style="display: flex; flex-direction: column">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 6px; border-bottom: 1px solid #F0F0EE">
            <div style="flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 15px; line-height: 22px">{{it.title}}</span>
              <span style="font-size: 12px; color: #6B7280">{{it.meta}}</span>
            </div>
            <div style="display: flex; gap: 6px">
              <button onClick="{{it.toToday}}" style="height: 32px; padding: 0 12px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; color: #1F2328; font-size: 13px; cursor: pointer">今天做</button>
              <button onClick="{{it.toTomorrow}}" style="height: 32px; padding: 0 12px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; color: #1F2328; font-size: 13px; cursor: pointer">明天</button>
              <button style="height: 32px; padding: 0 12px; border: 1px solid #DADDE3; border-radius: 6px; background: #FFFFFF; color: #1F2328; font-size: 13px; cursor: pointer">选日期</button>
              <button aria-label="删除：{{it.title}}" onClick="{{it.drop}}" style="width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #6B7280; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M6 6l1 14h10l1-14"></path></svg>
              </button>
            </div>
          </div>
        </sc-for>

        <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 56px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #5E6670">
            <span style="font-size: 16px; color: #1F2328">收集箱是空的</span>
            <span style="font-size: 13px">脑子里没有悬着的事了。</span>
          </div>
        </sc-if>
      </section>

      <span style="font-size: 12px; color: #6B7280">放了超过 14 天的事会在早间规划里提醒你处理一次。</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      toast: '',
      today: 6,
      later: 11,
      nextId: 50,
      items: [
        { id: 1, title: '给妈妈寄降压药', meta: '10月18日 · 在 iPhone 上记下' },
        { id: 2, title: '研究一下新的记账软件', meta: '10月15日 · 在 MacBook 上记下' },
        { id: 3, title: '把旧手机挂到闲鱼', meta: '10月9日 · 已放 12 天' },
        { id: 4, title: '问问小王推荐的那家牙科', meta: '10月7日 · 已放 14 天' }
      ]
    };
  }

  move(id, where) {
    const it = this.state.items.find((x) => x.id === id);
    const rest = this.state.items.filter((x) => x.id !== id);
    const patch = { items: rest };
    if (where === 'today') { patch.today = this.state.today + 1; patch.toast = '「' + it.title + '」已移到今天'; }
    if (where === 'tomorrow') { patch.later = this.state.later + 1; patch.toast = '「' + it.title + '」已安排到明天'; }
    if (where === 'drop') { patch.toast = '已删除「' + it.title + '」'; }
    this.setState(patch);
  }

  renderVals() {
    const items = this.state.items.map((it) => Object.assign({}, it, {
      toToday: () => this.move(it.id, 'today'),
      toTomorrow: () => this.move(it.id, 'tomorrow'),
      drop: () => this.move(it.id, 'drop')
    }));
    return {
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => {
        if (e.key !== 'Enter' || !this.state.draft.trim()) return;
        const item = { id: this.state.nextId, title: this.state.draft.trim(), meta: '刚刚 · 在 MacBook 上记下' };
        this.setState({ draft: '', toast: '', nextId: this.state.nextId + 1, items: [item].concat(this.state.items) });
      },
      toast: this.state.toast,
      hasToast: !!this.state.toast,
      items: items,
      empty: items.length === 0,
      count: items.length,
      todayCount: this.state.today,
      laterCount: this.state.later
    };
  }
}
</script>
</body>
</html>
