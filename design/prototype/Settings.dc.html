<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MyLog · 设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3A5CCC}a:hover{color:#2B479F}
button,input{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #FFFFFF; color: #1F2328; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px">

  <nav aria-label="设置分类" style="flex: 1 1 220px; box-sizing: border-box; background: #F7F7F5; border-right: 1px solid #ECECE9; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; color: #5E6670; text-decoration: none; font-size: 13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      返回
    </a>
    <div style="padding: 8px 10px 12px; font-size: 17px; font-weight: 600">设置</div>
    <a href="Settings.dc.html" aria-current="page" style="display: flex; align-items: center; height: 40px; padding: 0 10px; border-radius: 8px; background: #E9EDF8; color: #1F2328; text-decoration: none; font-weight: 500">账户与同步</a>
    <button style="display: flex; align-items: center; height: 40px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent; color: #1F2328; font-size: 14px; cursor: pointer; text-align: left">提醒与声音</button>
    <button style="display: flex; align-items: center; height: 40px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent; color: #1F2328; font-size: 14px; cursor: pointer; text-align: left">每日节奏</button>
    <button style="display: flex; align-items: center; height: 40px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent; color: #1F2328; font-size: 14px; cursor: pointer; text-align: left">快捷键</button>
    <button style="display: flex; align-items: center; height: 40px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent; color: #1F2328; font-size: 14px; cursor: pointer; text-align: left">外观</button>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px 32px 64px; display: flex; justify-content: center">
    <div style="width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 36px">

      <section aria-labelledby="s-account" style="display: flex; flex-direction: column; gap: 16px">
        <h1 id="s-account" style="margin: 0; font-size: 22px; font-weight: 600">账户与同步</h1>
        <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px; border: 1px solid #E6E6E3; border-radius: 12px">
          <span style="width: 44px; height: 44px; border-radius: 50%; background: #DDE3F5; color: #2B479F; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; flex: none">[我]</span>
          <div style="flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 500">[你的名字]</span>
            <span style="font-size: 13px; color: #5E6670">[手机号或邮箱] · 微信已绑定</span>
          </div>
          <button style="height: 36px; padding: 0 14px; border: 1px solid #DADDE3; border-radius: 8px; background: #FFFFFF; color: #1F2328; font-size: 13px; cursor: pointer">退出登录</button>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; background: #F1F7F3">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F7D4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H7a5 5 0 1 1 .9-9.92A6 6 0 0 1 19 11a4 4 0 0 1-1.5 8z"></path><path d="m9 14 2 2 4-4"></path></svg>
          <span style="flex: 1; font-size: 14px; color: #1E5434">已同步，刚刚</span>
          <span style="font-size: 12px; color: #2F6B45">断网时照常使用，联网后自动合并</span>
        </div>
      </section>

      <section aria-labelledby="s-devices" style="display: flex; flex-direction: column; gap: 8px">
        <h2 id="s-devices" style="margin: 0 0 4px; font-size: 15px; font-weight: 500">已登录的设备</h2>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #F0F0EE">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M1 20h22"></path></svg>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>MacBook · Chrome</span><span style="font-size: 12px; color: #6B7280">当前设备</span></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #F0F0EE">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="1.5"></rect><path d="M8 21h8M12 17v4"></path></svg>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>办公室电脑 · Windows 客户端</span><span style="font-size: 12px; color: #6B7280">2 分钟前同步</span></div>
          <button style="height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #5E6670; font-size: 13px; cursor: pointer">移除</button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #F0F0EE">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>iPhone · 手机网页版</span><span style="font-size: 12px; color: #6B7280">昨天 21:40 同步</span></div>
          <button style="height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #5E6670; font-size: 13px; cursor: pointer">移除</button>
        </div>
      </section>

      <section aria-labelledby="s-quiet" style="display: flex; flex-direction: column; gap: 4px">
        <h2 id="s-quiet" style="margin: 0 0 8px; font-size: 15px; font-weight: 500">提醒与声音 <span style="font-weight: 400; color: #6B7280; font-size: 12px">默认安静</span></h2>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #F0F0EE; cursor: pointer">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>到点提醒</span><span style="font-size: 12px; color: #6B7280">只对设置了提醒时间的事发通知</span></span>
          <input type="checkbox" role="switch" checked style="width: 18px; height: 18px; accent-color: #3A5CCC; margin: 0">
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #F0F0EE; cursor: pointer">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>完成时的声音</span><span style="font-size: 12px; color: #6B7280">关闭后只有轻微的划线动画</span></span>
          <input type="checkbox" role="switch" style="width: 18px; height: 18px; accent-color: #3A5CCC; margin: 0">
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #F0F0EE; cursor: pointer">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>连续天数与庆祝</span><span style="font-size: 12px; color: #6B7280">清空清单时只显示一句“今天的事都做完了”</span></span>
          <input type="checkbox" role="switch" style="width: 18px; height: 18px; accent-color: #3A5CCC; margin: 0">
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #F0F0EE; cursor: pointer">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>每天第一次打开时做早间规划</span><span style="font-size: 12px; color: #6B7280">有遗留或收集箱里有事时才出现</span></span>
          <input type="checkbox" role="switch" checked style="width: 18px; height: 18px; accent-color: #3A5CCC; margin: 0">
        </label>
      </section>

    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
