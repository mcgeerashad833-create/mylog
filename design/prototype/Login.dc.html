<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MyLog · 登录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3A5CCC}a:hover{color:#2B479F}
button,input{font-family:inherit}
input::placeholder{color:#8A9099}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #FFFFFF; color: #1F2328; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px">

  <aside style="flex: 1 1 420px; box-sizing: border-box; background: #F7F7F5; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
    <span style="font-size: 20px; font-weight: 600">MyLog</span>
    <div style="display: flex; flex-direction: column; gap: 28px; max-width: 420px">
      <h1 style="margin: 0; font-size: 34px; font-weight: 600; line-height: 46px">每天的琐事，<br>一条一条做完。</h1>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; color: #3D444D; font-size: 15px">
        <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A5CCC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>想到就记，3 秒存进收集箱</li>
        <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A5CCC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>每天只看今天该做的事</li>
        <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A5CCC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>电脑、手机自动同步，断网也能用</li>
      </ul>
    </div>
    <span style="font-size: 12px; color: #6B7280">[公司名称] · [备案号]</span>
  </aside>

  <main style="flex: 1 1 480px; box-sizing: border-box; padding: 56px 32px; display: flex; align-items: center; justify-content: center">
    <form style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-size: 24px; font-weight: 600">登录 / 注册</h2>
        <span style="font-size: 13px; color: #5E6670">未注册的手机号验证后自动创建账户</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="phone" style="font-size: 13px; font-weight: 500">手机号</label>
        <div style="display: flex; align-items: center; height: 46px; border: 1px solid #DADDE3; border-radius: 10px; padding: 0 12px; gap: 10px">
          <span style="color: #5E6670; font-size: 14px">+86</span>
          <span style="width: 1px; height: 18px; background: #E1E3E8"></span>
          <input id="phone" type="tel" placeholder="请输入手机号" style="flex: 1; min-width: 0; border: 0; outline: none; font-size: 15px; background: transparent; height: 100%">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="code" style="font-size: 13px; font-weight: 500">验证码</label>
        <div style="display: flex; gap: 10px">
          <input id="code" inputmode="numeric" placeholder="6 位数字" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; border: 1px solid #DADDE3; border-radius: 10px; padding: 0 12px; outline: none; font-size: 15px">
          <button type="button" style="flex: none; height: 46px; padding: 0 16px; border: 1px solid #DADDE3; border-radius: 10px; background: #FFFFFF; color: #1F2328; font-size: 14px; cursor: pointer">获取验证码</button>
        </div>
      </div>

      <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #5E6670; cursor: pointer">
        <input type="checkbox" style="width: 16px; height: 16px; margin: 2px 0 0; accent-color: #3A5CCC">
        <span>我已阅读并同意 <a href="#">用户协议</a> 和 <a href="#">隐私政策</a></span>
      </label>

      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; background: #3A5CCC; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">登录</a>

      <div style="display: flex; align-items: center; gap: 12px; color: #6B7280; font-size: 12px">
        <span style="flex: 1; height: 1px; background: #ECECE9"></span>其他方式<span style="flex: 1; height: 1px; background: #ECECE9"></span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" style="height: 44px; border: 1px solid #DADDE3; border-radius: 10px; background: #FFFFFF; color: #1F2328; font-size: 14px; cursor: pointer">微信扫码</button>
        <button type="button" style="height: 44px; border: 1px solid #DADDE3; border-radius: 10px; background: #FFFFFF; color: #1F2328; font-size: 14px; cursor: pointer">邮箱登录</button>
      </div>

      <a href="Main.dc.html" style="align-self: center; font-size: 13px; color: #5E6670">先不登录，仅在本机使用</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
