<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MyLog · 任务详情</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3A5CCC}a:hover{color:#2B479F}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #FFFFFF; color: #1F2328; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px">

  <nav aria-label="主导航" style="flex: 1 1 220px; box-sizing: border-box; background: #F7F7F5; border-right: 1px solid #ECECE9; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px">
    <div style="padding: 4px 10px 16px; font-size: 17px; font-weight: 600">MyLog</div>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; background: #E9EDF8; color: #1F2328; text-decoration: none; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A5CCC" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <span style="flex: 1">今天</span><span style="color: #5E6670; font-size: 13px">6</span>
    </a>
    <a href="Inbox.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; color: #1F2328; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
      <span style="flex: 1">收集箱</span><span style="color: #5E6670; font-size: 13px">4</span>
    </a>
    <a href="Later.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; color: #1F2328; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      <span style="flex: 1">以后</span><span style="color: #5E6670; font-size: 13px">11</span>
    </a>
    <a href="Log.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; color: #1F2328; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"></path><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 19.5"></path></svg>
      <span style="flex: 1">日志</span>
    </a>
  </nav>

  <main style="flex: 999 1 420px; min-width: 0; box-sizing: border-box; padding: 40px 32px; display: flex; flex-direction: column; gap: 20px; background: #FBFBFA">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; line-height: 36px">今天</h1>
      <span style="color: #5E6670">10月21日 周三</span>
    </div>
    <div style="display: flex; flex-direction: column; max-width: 640px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-bottom: 1px solid #F0F0EE"><span style="width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid #9AA1AC; box-sizing: border-box; flex: none"></span><span style="font-size: 15px">回复张经理关于报价的邮件</span></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-radius: 8px; background: #E9EDF8; box-shadow: inset 3px 0 0 #3A5CCC"><span style="width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid #9AA1AC; box-sizing: border-box; flex: none; background: #FFFFFF"></span><span style="font-size: 15px; font-weight: 500">交 10 月报销单</span></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-bottom: 1px solid #F0F0EE"><span style="width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid #9AA1AC; box-sizing: border-box; flex: none"></span><span style="font-size: 15px">部门周会</span></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-bottom: 1px solid #F0F0EE"><span style="width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid #9AA1AC; box-sizing: border-box; flex: none"></span><span style="font-size: 15px">给物业打电话问停车位</span></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-bottom: 1px solid #F0F0EE"><span style="width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid #9AA1AC; box-sizing: border-box; flex: none"></span><span style="font-size: 15px">订周五去上海的高铁票</span></div>
    </div>
  </main>

  <aside aria-label="任务详情" style="flex: 1 1 400px; box-sizing: border-box; border-left: 1px solid #ECECE9; background: #FFFFFF; padding: 24px 28px; display: flex; flex-direction: column; gap: 24px; box-shadow: -8px 0 24px rgba(16,24,40,0.05)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; color: #5E6670">今天 · 第 2 件</span>
      <a href="Main.dc.html" aria-label="关闭详情" style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #5E6670">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 12px">
      <button aria-label="完成：交 10 月报销单" style="width: 28px; height: 28px; margin-top: 2px; flex: none; border: 1.6px solid #9AA1AC; border-radius: 50%; background: #FFFFFF; padding: 0; cursor: pointer"></button>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <label for="d-title" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">标题</label>
        <input id="d-title" value="交 10 月报销单" style="border: 0; outline: none; font-size: 20px; font-weight: 600; color: #1F2328; padding: 0; background: transparent">
      </div>
      <button aria-label="标为重要" aria-pressed="false" style="width: 36px; height: 36px; flex: none; border: 0; border-radius: 8px; background: transparent; color: #5E6670; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; border-top: 1px solid #F0F0EE; border-bottom: 1px solid #F0F0EE">
      <button style="display: flex; align-items: center; gap: 12px; height: 44px; border: 0; background: transparent; padding: 0; font-size: 14px; color: #1F2328; cursor: pointer; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        <span style="width: 64px; color: #5E6670">日期</span><span style="flex: 1">今天</span>
      </button>
      <button style="display: flex; align-items: center; gap: 12px; height: 44px; border: 0; background: transparent; padding: 0; font-size: 14px; color: #1F2328; cursor: pointer; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="width: 64px; color: #5E6670">提醒</span><span style="flex: 1">下午 4:00</span>
      </button>
      <button style="display: flex; align-items: center; gap: 12px; height: 44px; border: 0; background: transparent; padding: 0; font-size: 14px; color: #1F2328; cursor: pointer; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6670" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg>
        <span style="width: 64px; color: #5E6670">重复</span><span style="flex: 1">每月 21 号</span>
      </button>
    </div>

    <section aria-label="子步骤" style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 500">子步骤</h2>
        <span style="font-size: 12px; color: #5E6670">1 / 3</span>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer">
        <input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #3A5CCC; margin: 0">
        <span style="font-size: 14px; color: #6B7280; text-decoration: line-through">把发票贴到报销单上</span>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer">
        <input type="checkbox" style="width: 16px; height: 16px; accent-color: #3A5CCC; margin: 0">
        <span style="font-size: 14px">找部门领导签字</span>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer">
        <input type="checkbox" style="width: 16px; height: 16px; accent-color: #3A5CCC; margin: 0">
        <span style="font-size: 14px">交到财务室（3 楼）</span>
      </label>
      <button style="display: flex; align-items: center; gap: 10px; min-height: 40px; border: 0; background: transparent; padding: 0; color: #5E6670; font-size: 14px; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        添加步骤
      </button>
    </section>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="d-note" style="font-size: 14px; font-weight: 500">备注</label>
      <textarea id="d-note" rows="4" style="resize: vertical; border: 1px solid #E1E3E8; border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 22px; color: #1F2328; outline: none">打车票 3 张、餐费 2 张。财务周五下午不收单。</textarea>
    </div>

    <div style="flex: 1"></div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid #F0F0EE; font-size: 12px; color: #6B7280">
      <span>创建于 10月20日 · 在 iPhone 上</span>
      <button style="height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #B42318; font-size: 13px; cursor: pointer">删除</button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
